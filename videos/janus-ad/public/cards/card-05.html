<div class="card" data-card-id="card-05">
  <style>
    .card[data-card-id="card-05"] .root {
      --accent: #a78bfa;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
      
      /* Glassmorphism background */
      background: rgba(45, 45, 55, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      
      padding: 50px 60px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      gap: 20px;
    }
    
    .card[data-card-id="card-05"] .meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .card[data-card-id="card-05"] .kicker-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent), 0 0 4px var(--accent);
    }
    
    .card[data-card-id="card-05"] .kicker {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
    }
    
    .card[data-card-id="card-05"] .title {
      margin: 0;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }
    
    /* Telusko yellow highlight style */
    .card[data-card-id="card-05"] .title span.hl {
      color: #facc15;
      text-shadow: 0 0 24px rgba(250, 204, 21, 0.45);
    }
    
    .card[data-card-id="card-05"] .detail {
      margin: 0;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.5;
      color: #d1d5db;
      max-width: 95%;
    }
  </style>
  <div class="root">
    <div class="meta">
      <span class="kicker-dot" data-anim="scale-pop" data-anim-at="0.05" data-anim-duration="0.4"></span>
      <span class="kicker" data-anim="fade-in" data-anim-at="0.1" data-anim-duration="0.4">THE TRAP</span>
    </div>
    <h2 class="title" data-anim="blur-in" data-anim-at="0.3" data-anim-duration="0.7">ADVICE FOR <span class="hl">100 CRORE</span> PEOPLE</h2>
    <p class="detail" data-anim="fade-in" data-anim-at="0.8" data-anim-duration="0.5">How can a single generic advice fit millions of people with different backgrounds?</p>
  </div>
</div>
